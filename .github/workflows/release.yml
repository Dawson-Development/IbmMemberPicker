name: Build VSIX Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update package version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const pkg=require('./package.json'); pkg.version='${{ steps.version.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Validate TypeScript
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        shell: bash
        run: bash ./scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibm-member-picker-vsix
          path: vsix/*.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vsix/*.vsix --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
